<ion-list class="bckgrList ion-padding-horizontal ion-margin-top">
  <ion-card mode="md" color="urologia-tertiary">
    <ion-card-header>
      <ion-card-subtitle (click)="toggleAccordion()" color="urologia-tertiary">
        <span [ngClass]="this.isMenuOpen ? 'title-active2' : 'title-inactive2'" *ngIf="isMenuOpen">&#8722;</span>
        <span [ngClass]="this.isMenuOpen ? 'title-active2' : 'title-inactive2'" *ngIf="!isMenuOpen">&#43;</span>
        <ion-label class="headerAcordeon" [ngClass]="this.isMenuOpen ? 'title-active2' : 'title-inactive2'">
          Productos Patrocinadores</ion-label>
      </ion-card-subtitle>
    </ion-card-header>

    <ion-card-content #myDiv [ngClass]="this.isMenuOpen ? 'active2' : 'inactive2'">
      <ion-item *ngFor="let element of this.elementList" (click)="selectedItem(element)" color="urologia-tertiary"
        button="true" detail="false">
        <ion-label class="ion-text-wrap">
          <h2 class="textNormal">{{ element.Brand}}</h2>
        </ion-label>
        <ion-icon class="iconoArrowListado" name="arrow-forward-outline" slot="end"></ion-icon>
      </ion-item>
    </ion-card-content>
  </ion-card>
</ion-list>
