<ion-header>
  <ion-toolbar>
    <ion-title>{{ title }}</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col text-center size="12">
        <div *ngIf="noteHTML; else htmlNoteFalse">
          <p [innerHTML]="noteHTML" class="nota-reagent"></p>
        </div>
        <ng-template #htmlNoteFalse>
          <p class="nota-pop">{{ note }}</p><br>
        </ng-template>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col text-center size="8">
        <p></p>
      </ion-col>
      <ion-col text-center size="4">
        <ion-button (click)="closeModel()">Close</ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
