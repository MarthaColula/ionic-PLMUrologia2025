<app-header></app-header>
<app-navigation-header titulo="IPPA"></app-navigation-header>

<ion-content class="ion-padding-horizontal">
  <div>
    <ng-container *ngIf="productShot">
      <ion-img class="imgLogoProductShot" [src]="productShot"></ion-img>
    </ng-container>

    <ng-container *ngIf="!checkFavoriteProduct(this.product)">
      <ion-button color="blue" class="chipFavoritos" size="small" mode="ios" expand="block"
        (click)="addProductFavourite(this.product)">
        Agregar a favoritos
        <ion-icon slot="end" name="star"></ion-icon>
      </ion-button>
    </ng-container>

    <ng-container *ngIf="checkFavoriteProduct(this.product)">
      <ion-button color="red" class="chipFavoritosDelete" size="small" mode="ios" expand="block"
        (click)="removeProductFavourite( this.product)">
        Eliminar de favoritos
        <ion-icon slot="end" name="star"></ion-icon>
      </ion-button>
    </ng-container>
    <br>


    <h1 class="nombreProducto ion-margin-top">{{this.brand}}</h1>
    <p class="formaFarma"> <em>{{this.pharmaForm}}</em> </p>

    <app-active-substances [substances]="this.productActiveSubstances"></app-active-substances>

    <app-easy-accordion #myDiv *ngFor="let attribute of this.attributes" title="{{attribute.AttributeName }}"
      content="{{attribute.HTMLContent }}" [objeto]="attribute" (change)="captureName($event)">
    </app-easy-accordion>
