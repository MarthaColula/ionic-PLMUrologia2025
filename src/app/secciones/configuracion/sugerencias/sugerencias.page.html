<app-header></app-header>
<app-navigation-header titulo="Sugerencias"></app-navigation-header>

<ion-content class="ion-padding">
  <ng-container *ngIf="comments">
    <ng-container *ngIf="comments.length > 0; else Empty">

      <p class="formaFarma textNormal">Elija una sugerencia y agregue un comentario con respecto a su sugerencia</p>
      <ion-card mode="ios" color="urologia-primary">
        <ion-list class="bckgrList">

          <ion-item *ngFor="let comment of comments; let i = index" multiple="false" color="mujer-primary">
            <ion-label>{{comment.TypeDescription}}</ion-label>
            <ion-checkbox (click)="selectedComent(i)" color="mujer-secondary" slot="start"
              value="servicios"></ion-checkbox>
          </ion-item>

          <ion-item color="mujer-primary">
            <ion-textarea [(ngModel)]="myInput" maxlength=256 (ionBlur)="textComent()" required="true"
              clearOnEdit="false" placeholder="Ingrese aquí su comentario..."></ion-textarea>
          </ion-item>
        </ion-list>
      </ion-card>
