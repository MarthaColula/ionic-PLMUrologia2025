<app-header></app-header>
<app-navigation-header titulo="Abstracts"></app-navigation-header>

<ion-content [fullscreen]="true">


  <ion-card color="urologia-primary" class="bckgrList cardResumen">
    <div class="contentCenefa"></div>

    <ng-container *ngIf="this.exception | async;">
      <ion-card-content>
        <h2>Por el momento, el Abstract no se encuentran disponible.</h2>
      </ion-card-content>
    </ng-container>

    <ng-container *ngIf="this.successRequest | async;">
      <ion-card-header>
        <ion-card-title>
          <h2>{{ this.mTitle }}</h2>
        </ion-card-title>
        <ion-card-subtitle mode="ios"><em>Resumen</em></ion-card-subtitle>
      </ion-card-header>

      <ion-card-content class="bckgrList">
        <ion-item color="urologia-primary">
          <ion-label class="ion-text-left">
            <p class="textNormal ion-text-justify">{{ this.mDescription }}</p>
          </ion-label>
        </ion-item>
      </ion-card-content>

      <div class="row d-flex justify-content-end p-3">

        <ion-button size="small" class="w-auto" color="urologia-secondary" mode="md" (click)="showOriginalArticle()">
          Ver artículo original
        </ion-button>

      </div>

    </ng-container>
  </ion-card>
