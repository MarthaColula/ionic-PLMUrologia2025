<app-header></app-header>
<app-navigation-header titulo=""></app-navigation-header>

<ion-content class="ion-padding-horizontal">

  <ion-row class="contentTituloSeccion">
    <ion-col size="12" class="text-center">
      <img class="iconoSeccion" src="assets/images/cenefaPodcast.svg" alt="">
    </ion-col>
  </ion-row>
  <br>

  <ng-container *ngIf="successRequest | async;">
    <ng-container *ngIf="this.articlesService.getDynamicSection(); else Empty;">
      <app-collapse-element-list #myDiv *ngFor="let item of this.articlesService.sectionJsonResult$ | async"
        title="{{item.subSectionName}}" [elementList]="item.casosClinicos" [section]="sectionName" [img]="img"
        (selected)="viewPDF($event)" (toggle)="closeAccordion()">
      </app-collapse-element-list>
    </ng-container>

    <ng-template #Empty>
      <ion-item class="ion-text-center" color="urologia-primary" lines="none">
        <ion-label>Podcast no disponibles.</ion-label>
      </ion-item>
    </ng-template>

    <ion-item *ngIf="exception | async;" class="ion-text-center" lines="none" color="urologia-primary">
      <ion-label>
        Ocurrió un problema!
      </ion-label>
    </ion-item>
  </ng-container>
